[package]
name = "auto-fuzz"
version = "0.1.0"
edition = "2021"
authors = ["re:Vise Team"]
description = "General-purpose evolutionary fuzzer engine — atom-chain generation + havoc mutation, driven by corpus feedback"
license = "MIT"
repository = "https://github.com/MamiyaTakuji2005/auto-fuzz"

[dependencies]
rand = { version = "0.8", features = ["small_rng"] }
rand_chacha = "0.3"
tokio = { version = "1", features = ["time", "rt-multi-thread", "macros", "sync"] }
async-trait = "0.1"
regex = "1"
url = "2"
toml = "0.8"
serde = { version = "1", features = ["derive"] }

# Optional: HTTP probing for fuzz-gui binary
reqwest = { version = "0.12", default-features = false, features = ["http2", "rustls-tls"], optional = true }
egui = { version = "0.31", optional = true }
eframe = { version = "0.31", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[[bin]]
name = "fuzz-gui"
path = "src/bin/fuzz-gui.rs"
required-features = ["gui"]

[[bin]]
name = "calibrate"
path = "src/bin/calibrate.rs"

[[bin]]
name = "stress"
path = "src/bin/stress.rs"

[features]
default = []
gui = ["dep:reqwest", "dep:egui", "dep:eframe"]

[profile.release]
opt-level = "z"     # optimize for size
lto = true           # link-time optimization
codegen-units = 1    # better LTO
strip = true         # strip symbols
