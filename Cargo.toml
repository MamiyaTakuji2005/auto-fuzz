[package]
name = "auto-fuzz"
version = "0.1.0"
edition = "2021"
authors = ["re:Vise Team"]
description = "General-purpose evolutionary fuzzer engine — atom-chain generation + havoc mutation, driven by corpus feedback"
license = "MIT"
repository = "https://github.com/MamiyaTakuji2005/auto-fuzz"

[dependencies]
rand = { version = "0.8", features = ["small_rng"] }
rand_chacha = "0.3"
tokio = { version = "1", features = ["time", "rt-multi-thread", "macros", "sync"] }
async-trait = "0.1"
regex = "1"
url = "2"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Optional: HTTP probing for fuzz-gui binary
reqwest = { version = "0.12", default-features = false, features = ["http2", "rustls-tls", "cookies"], optional = true }
egui = { version = "0.31", optional = true }
eframe = { version = "0.31", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[[bin]]
name = "fuzz-gui"
path = "src/bin/fuzz-gui.rs"
required-features = ["gui"]

[[bin]]
name = "fuzz"
path = "src/bin/fuzz.rs"
required-features = ["http"]

[[bin]]
name = "calibrate"
path = "src/bin/calibrate.rs"

[[bin]]
name = "stress"
path = "src/bin/stress.rs"

[[bin]]
name = "signal_sweep"
path = "src/bin/signal_sweep.rs"

[[bin]]
name = "atom_audit"
path = "src/bin/atom_audit.rs"

[[bin]]
name = "cap_sweep"
path = "src/bin/cap_sweep.rs"

[[bin]]
name = "havoc_ablation"
path = "src/bin/havoc_ablation.rs"

[[bin]]
name = "sweep"
path = "src/bin/sweep.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[[bin]]
name = "report"
path = "src/bin/report.rs"

[features]
default = []
# Real HTTP transport (reqwest) — enables the `http` module + `fuzz` CLI.
# Keepalive is DISABLED by default: fuzzing benefits from fresh connections
# per request so the target cannot serialize probes down a single pipe.
http = ["dep:reqwest"]
# Opt-in to connection reuse (keepalive). Useful for targets that rate-limit
# connection churn or require session state across probes.
keepalive = ["http"]
# GUI workbench builds on the HTTP transport.
gui = ["http", "dep:egui", "dep:eframe"]

[profile.release]
opt-level = "z"     # optimize for size
lto = true           # link-time optimization
codegen-units = 1    # better LTO
strip = true         # strip symbols
