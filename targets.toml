# Mock targets for calibration.
# Each entry defines trigger conditions and simulated responses.
#
# Add new targets by copying an existing block and editing.
# The probe extracts the injected payload from the URL query string
# and checks if any trigger substring matches.

[[targets]]
name = "sqli"
trigger_payload = "42'; DROP TABLE users--"
baseline_url = "http://mock/?q=1"

[targets.response]
triggers = ["42", "' OR"]
trigger_status = 500
trigger_body = "SQL error near '{{payload}}'"
clean_delay_ms = 5
trigger_delay_ms = 5

[[targets]]
name = "xss"
trigger_payload = "<script>alert(1)</script>"
baseline_url = "http://mock/?q=1"

[targets.response]
triggers = ["<script>", "onerror=", "onload="]
trigger_status = 200
trigger_body = "<html>{{payload}}</html>"
clean_delay_ms = 5
trigger_delay_ms = 5

[[targets]]
name = "cmdi"
trigger_payload = "; cat /etc/passwd"
baseline_url = "http://mock/?q=1"

[targets.response]
triggers = [";", "cat ", "ls "]
trigger_status = 500
trigger_body = "command execution error"
clean_delay_ms = 5
trigger_delay_ms = 25

[[targets]]
name = "ssti"
trigger_payload = "{{7*7}}"
baseline_url = "http://mock/?q=1"

[targets.response]
triggers = ["{{", "7*7", "${"]
trigger_status = 200
trigger_body = "<html>result: {{payload}}</html>"
clean_delay_ms = 5
trigger_delay_ms = 5

# ── More complex scenarios ──────────────────────────────────────────────

[[targets]]
name = "sqli-strict"
trigger_payload = "' OR '1'='1"
baseline_url = "http://mock/?q=1"

[targets.response]
triggers = ["OR ", "UNION", "--"]
trigger_status = 500
trigger_body = "You have an error in your SQL syntax"
clean_delay_ms = 2
trigger_delay_ms = 10

[[targets]]
name = "xss-reflected"
trigger_payload = "<img src=x onerror=alert(1)>"
baseline_url = "http://mock/?q=1"

[targets.response]
triggers = ["<img", "onerror", "<svg", "onload"]
trigger_status = 200
trigger_body = "<div>{{payload}}</div>"
clean_delay_ms = 3
trigger_delay_ms = 3

[[targets]]
name = "ssrf"
trigger_payload = "http://169.254.169.254/latest/meta-data/"
baseline_url = "http://mock/?url=http://example.com"

[targets.response]
triggers = ["169.254", "metadata", "ami-id"]
trigger_status = 200
# Realistic metadata response (IAM credentials blob). The old 12-byte
# "ami-12345678" fell under SizeClassifier's 50-byte floor.
trigger_body = '''
{"Code":"Success","LastUpdated":"2026-07-15T19:51:03Z","Type":"AWS-HMAC","AccessKeyId":"ASIAIOSFODNN7EXAMPLE","SecretAccessKey":"wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY","Token":"IQoJb3JpZ2luX2VjEND...","Expiration":"2026-07-15T20:00:00Z"}'''
# A match here confirms a real leak (vs a mere size change).
confirm_signatures = ["AccessKeyId", "ami-id"]
clean_delay_ms = 5
trigger_delay_ms = 200

[[targets]]
name = "path-traversal"
trigger_payload = "../../../../etc/passwd"
baseline_url = "http://mock/?q=1"

[targets.response]
triggers = ["../", "etc/passwd", "%2e%2e"]
trigger_status = 200
# Realistic leak: the whole file, not one line. A single 31-byte line falls
# under SizeClassifier's 50-byte floor, so no signal ever fires.
trigger_body = '''
root:x:0:0:root:/root:/bin/bash
daemon:x:1:1:daemon:/usr/sbin:/usr/sbin/nologin
bin:x:2:2:bin:/bin:/usr/sbin/nologin
sys:x:3:3:sys:/dev:/usr/sbin/nologin
www-data:x:33:33:www-data:/var/www:/usr/sbin/nologin
'''
# A match here confirms a real file read (vs a mere size change).
confirm_signatures = ["root:x:0:0"]
clean_delay_ms = 5
trigger_delay_ms = 5

[[targets]]
name = "waf-blocked"
trigger_payload = "' OR '1'='1"
baseline_url = "http://mock/?q=1"

[targets.response]
# This target blocks everything with a 403 — tests how the fuzzer handles dead ends.
triggers = ["__NEVER_MATCH__"]
trigger_status = 403
trigger_body = "Forbidden"
clean_status = 403
clean_body = "Forbidden"
clean_delay_ms = 1
trigger_delay_ms = 1
